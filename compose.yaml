name: commune

# The local config template is rendered into /run/commune/config.json at
# container start. create_host_path: false makes a missing file fail clearly
# instead of silently creating a directory.
x-commune-config-volume: &commune-config-volume
  type: bind
  source: ${COMMUNE_CONFIG_TEMPLATE:-./deploy/commune.json}
  target: /etc/commune/config.template.json
  read_only: true
  bind:
    create_host_path: false

x-commune: &commune
  image: ${COMMUNE_IMAGE:-commune-backend:local}
  build:
    context: .
    additional_contexts:
      mygo: ${MYGO_CONTEXT:-../../mygo}
    args:
      MYGO_GENERATE: ${MYGO_GENERATE:-false}
      GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
  environment:
    COMMUNE_DB_HOST: postgres
    COMMUNE_DB_PORT: "5432"
    COMMUNE_DB_NAME: commune
    COMMUNE_DB_USER: commune
    COMMUNE_DB_PASSWORD_FILE: /run/secrets/postgres_password
    COMMUNE_DB_SSLMODE: disable
    COMMUNE_OUTBOX_SECRET: ${COMMUNE_OUTBOX_SECRET:-}
    COMMUNE_SMTP_PASSWORD: ${COMMUNE_SMTP_PASSWORD:-}
  secrets:
    - postgres_password
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - backend

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: commune
      POSTGRES_USER: commune
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commune -d commune"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped
    shm_size: 256mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *commune
    command: ["migrate"]
    volumes:
      - *commune-config-volume
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  provision-sites:
    <<: *commune
    command: ["provision-sites"]
    volumes:
      - *commune-config-volume
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *commune
    command: ["serve"]
    ports:
      - "127.0.0.1:${COMMUNE_HTTP_PORT:-8080}:8080"
    volumes:
      - *commune-config-volume
      - media:/var/lib/commune/media
    depends_on:
      provision-sites:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - backend
      - egress
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "${COMMUNE_HTTPS_PORT:-443}:443"
      - "${COMMUNE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./frontend/dist
        target: /srv/frontend
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true
  egress:
  frontend:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
