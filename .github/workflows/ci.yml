name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mygo-lang/mygo
          ref: e19e0a635bad0628a4c8ab239a1f317d22c3b27e
          path: mygo-checkout
      - name: Link the pinned compiler sibling
        run: ln -s "$GITHUB_WORKSPACE/mygo-checkout" "$GITHUB_WORKSPACE/../../mygo"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - name: Verify generation, build, protocol snapshots and PostgreSQL tests
        run: make verify
